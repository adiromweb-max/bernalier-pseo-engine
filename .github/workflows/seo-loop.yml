name: Bernalier SEO Loop

# Weekly (Wednesday): check indexing -> pull Search Console data -> auto-expand the page map
# -> refresh internal-link silos. Replaces the separate index-check workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 3'

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    env:
      BERNALIER_WP_USER: ${{ secrets.BERNALIER_WP_USER }}
      BERNALIER_WP_APP_PASS: ${{ secrets.BERNALIER_WP_APP_PASS }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BERNALIER_AUTO_EXPAND: ${{ vars.BERNALIER_AUTO_EXPAND || 'true' }}
      BERNALIER_MAX_PAGES: ${{ vars.BERNALIER_MAX_PAGES || '250' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Indexing check + sitemap resubmit
        run: python -m engine.index_check
      - name: Search Console feedback loop (+ auto-expand)
        run: python -m engine.gsc_loop
      - name: Refresh internal-link silos
        run: python -m engine.relink --apply
      - name: Commit data
        run: |
          git config user.name "bernalier-engine-bot"
          git config user.email "bot@a-webm.com"
          git add data/ || true
          git commit -m "SEO loop: update data [skip ci]" || echo "no changes"
          git pull --rebase || true
          git push || echo "nothing to push"
