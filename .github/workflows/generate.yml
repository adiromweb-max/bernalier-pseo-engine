name: Bernalier pSEO Engine

# Run manually (button in Actions tab) OR automatically every Monday (slow drip: 8 pages/week)
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which batch to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - quickwins
      live:
        description: 'Push to WordPress? (unchecked = dry run, files only)'
        required: true
        default: false
        type: boolean
      limit:
        description: 'Max pages this run (start small: 3)'
        required: true
        default: '3'
        type: string
  schedule:
    # 06:00 UTC Monday + Thursday, 4 pages each = 8/week (steady drip, not a spike)
    - cron: '17 6 * * 1,4'

permissions:
  contents: write   # lets the bot commit data/generation_state.json back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BERNALIER_WP_USER: ${{ secrets.BERNALIER_WP_USER }}
          BERNALIER_WP_APP_PASS: ${{ secrets.BERNALIER_WP_APP_PASS }}
          # set repo variable BERNALIER_PUBLISH_STATUS=publish to go live automatically; default = draft
          BERNALIER_PUBLISH_STATUS: ${{ vars.BERNALIER_PUBLISH_STATUS || 'draft' }}
        run: |
          # scheduled runs = full refresh, live; manual = use the inputs
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python run.py --batch all --live --limit 4 2>&1 | tee run.log
          else
            LIVE_FLAG=""
            if [ "${{ github.event.inputs.live }}" = "true" ]; then LIVE_FLAG="--live"; fi
            python run.py --batch ${{ github.event.inputs.batch }} $LIVE_FLAG --limit ${{ github.event.inputs.limit }} 2>&1 | tee run.log
          fi

      - name: Upload generated pages (for review)
        uses: actions/upload-artifact@v4
        with:
          name: generated-pages
          path: output/
          retention-days: 30

      - name: Commit state file (anti-duplication tracking)
        run: |
          git config user.name "bernalier-engine-bot"
          git config user.email "bot@a-webm.com"
          git add data/generation_state.json || true
          git commit -m "Update generation state [skip ci]" || echo "no changes"
          git push || echo "nothing to push"

      - name: Notify Adi (summary / failure alert)
        if: always()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m engine.notify generate ${{ job.status }} run.log

